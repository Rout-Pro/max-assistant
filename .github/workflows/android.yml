name: Build & test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unit tests
        run: bash gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Assemble debug APK
        run: bash gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: max-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
