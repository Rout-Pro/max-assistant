name: UI screenshot check

on:
  workflow_dispatch:

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: bash gradlew :app:assembleDebug --no-daemon
      - name: Sign APK (persistent key)
        env:
          MAX_KEYSTORE_BASE64: ${{ secrets.MAX_KEYSTORE_BASE64 }}
          MAX_KEYSTORE_PASSWORD: ${{ secrets.MAX_KEYSTORE_PASSWORD }}
          MAX_KEY_ALIAS: ${{ secrets.MAX_KEY_ALIAS }}
          MAX_KEY_PASSWORD: ${{ secrets.MAX_KEY_PASSWORD }}
        run: |
          echo "$MAX_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/max.keystore"
          APKSIGNER=$(ls "$ANDROID_HOME/build-tools/"*/apksigner | sort -V | tail -1)
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/max.keystore" --ks-pass "pass:$MAX_KEYSTORE_PASSWORD" --ks-key-alias "$MAX_KEY_ALIAS" --key-pass "pass:$MAX_KEY_PASSWORD" --out app/build/outputs/apk/debug/Max.apk app/build/outputs/apk/debug/app-debug.apk
          rm -f "$RUNNER_TEMP/max.keystore"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator, install, drive UI, capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            mkdir -p shots
            adb install app/build/outputs/apk/debug/Max.apk
            adb shell monkey -p com.rout.max -c android.intent.category.LAUNCHER 1
            sleep 12
            adb exec-out screencap -p > shots/01-home.png
            # type a keyless local command on Home and send it
            adb shell input tap 400 2000   # text field
            sleep 1
            adb shell input text "time kya hai"
            sleep 1
            adb exec-out screencap -p > shots/02-home-typed.png
            adb shell input keyevent 111  # ESC to dismiss keyboard
            sleep 1
            adb shell input tap 970 2005   # send button
            sleep 6
            adb exec-out screencap -p > shots/03-home-reply.png
            # quick action: Good morning briefing (keyless, on-device)
            adb shell input tap 260 1375   # briefing chip
            sleep 8
            adb exec-out screencap -p > shots/08-briefing.png
            # switch through tabs (bottom nav, 5 tabs on 1080x2400)
            adb shell input tap 324 2270   # Chat
            sleep 3
            adb exec-out screencap -p > shots/04-chat.png
            adb shell input tap 540 2270   # Control
            sleep 3
            adb exec-out screencap -p > shots/05-control.png
            adb shell input tap 756 2270   # Memory
            sleep 3
            adb exec-out screencap -p > shots/06-memory.png
            adb shell input tap 972 2270   # Settings
            sleep 3
            adb exec-out screencap -p > shots/07-settings.png
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: max-ui-shots
          path: shots/
      - name: Upload built APK
        uses: actions/upload-artifact@v4
        with:
          name: max-debug-apk-fixed
          path: app/build/outputs/apk/debug/Max.apk
