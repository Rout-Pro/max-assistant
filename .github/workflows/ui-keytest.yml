name: Key diagnostics check

on:
  workflow_dispatch:

jobs:
  keytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: bash gradlew :app:assembleDebug --no-daemon
      - name: Sign APK (persistent key)
        env:
          MAX_KEYSTORE_BASE64: ${{ secrets.MAX_KEYSTORE_BASE64 }}
          MAX_KEYSTORE_PASSWORD: ${{ secrets.MAX_KEYSTORE_PASSWORD }}
          MAX_KEY_ALIAS: ${{ secrets.MAX_KEY_ALIAS }}
          MAX_KEY_PASSWORD: ${{ secrets.MAX_KEY_PASSWORD }}
        run: |
          echo "$MAX_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/max.keystore"
          APKSIGNER=$(ls "$ANDROID_HOME/build-tools/"*/apksigner | sort -V | tail -1)
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/max.keystore" --ks-pass "pass:$MAX_KEYSTORE_PASSWORD" --ks-key-alias "$MAX_KEY_ALIAS" --key-pass "pass:$MAX_KEY_PASSWORD" --out app/build/outputs/apk/debug/Max.apk app/build/outputs/apk/debug/app-debug.apk
          rm -f "$RUNNER_TEMP/max.keystore"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator, drive UI, capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            mkdir -p shots
            adb install app/build/outputs/apk/debug/Max.apk
            adb shell monkey -p com.rout.max -c android.intent.category.LAUNCHER 1
            sleep 12
            # open Settings tab (floating glass nav bar)
            adb shell input tap 946 2160
            sleep 3
            adb exec-out screencap -p > shots/09-settings-before.png
            # enter a deliberately INVALID key to exercise the diagnostics path
            adb shell input tap 540 1314  # API key field (below Model label area)
            sleep 1
            adb shell input text "AIzaINVALIDKEY1234567890123456789012"
            sleep 1
            adb shell input keyevent 111  # ESC dismisses keyboard
            sleep 1
            adb shell input tap 195 1659  # Save key
            sleep 1
            adb shell input tap 510 1659  # Key test karo
            sleep 12
            adb exec-out screencap -p > shots/10-settings-keytest.png
            # chat should now name the real cause instead of the generic message
            adb shell input tap 336 2160  # Chat tab
            sleep 3
            adb shell input tap 400 2090  # chat input
            sleep 1
            adb shell input text "hlo"
            sleep 1
            adb shell input keyevent 111
            sleep 1
            adb shell input tap 985 2090  # send
            sleep 20
            adb exec-out screencap -p > shots/11-chat-keydiag.png
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: keytest-shots
          path: shots/
