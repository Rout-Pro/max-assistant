name: UI motion capture

on:
  workflow_dispatch:

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: bash gradlew :app:assembleDebug --no-daemon
      - name: Sign APK (persistent key)
        env:
          MAX_KEYSTORE_BASE64: ${{ secrets.MAX_KEYSTORE_BASE64 }}
          MAX_KEYSTORE_PASSWORD: ${{ secrets.MAX_KEYSTORE_PASSWORD }}
          MAX_KEY_ALIAS: ${{ secrets.MAX_KEY_ALIAS }}
          MAX_KEY_PASSWORD: ${{ secrets.MAX_KEY_PASSWORD }}
        run: |
          echo "$MAX_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/max.keystore"
          APKSIGNER=$(ls "$ANDROID_HOME/build-tools/"*/apksigner | sort -V | tail -1)
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/max.keystore" --ks-pass "pass:$MAX_KEYSTORE_PASSWORD" --ks-key-alias "$MAX_KEY_ALIAS" --key-pass "pass:$MAX_KEY_PASSWORD" --out app/build/outputs/apk/debug/Max.apk app/build/outputs/apk/debug/app-debug.apk
          rm -f "$RUNNER_TEMP/max.keystore"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator, install, record nav pill motion
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          script: |
            mkdir -p shots
            adb install app/build/outputs/apk/debug/Max.apk
            adb shell monkey -p com.rout.max -c android.intent.category.LAUNCHER 1
            sleep 12
            adb shell screenrecord --time-limit 60 /sdcard/nav.mp4 &
            REC=$!
            sleep 2
            adb shell input tap 336 2160   # Chat
            sleep 2
            adb shell input tap 540 2160   # Control
            sleep 2
            adb shell input tap 743 2160   # Memory
            sleep 2
            adb shell input tap 946 2160   # Settings
            sleep 2
            adb shell input tap 133 2160   # Home
            sleep 2
            adb shell input tap 336 2160   # Chat again
            sleep 2
            adb shell pkill -2 screenrecord || true
            sleep 2
            adb pull /sdcard/nav.mp4 shots/nav.mp4
            adb exec-out screencap -p > shots/end-chat.png
      - name: Upload motion capture
        uses: actions/upload-artifact@v4
        with:
          name: max-nav-motion
          path: shots/
